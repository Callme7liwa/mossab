server {
    listen 80;
    # Include both domains so Certbot can verify both
    server_name estate.intellisoft.software www.estate.intellisoft.software;

    # Frontend static files (Ensure this path is correct for your NEW instance)
    root /home/ubuntu/data-analytics-re/dist;
    index index.html;

    # Essential for Let's Encrypt validation
    location ~ /.well-known/acme-challenge {
        allow all;
        root /home/ubuntu/data-analytics-re/dist;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API Proxy (optional for now, but good to have)
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}